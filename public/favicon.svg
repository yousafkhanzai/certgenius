<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    #cg-light { display: inline; }
    #cg-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      #cg-light { display: none; }
      #cg-dark { display: inline; }
    }
  </style>
  <g id="cg-light">
    <rect width="64" height="64" rx="14" fill="#1a3d7c"/>
    <text x="32" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#ffffff">C</text>
  </g>
  <g id="cg-dark">
    <rect width="64" height="64" rx="14" fill="#3b6fd4"/>
    <text x="32" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#0b1220">C</text>
  </g>
</svg>
